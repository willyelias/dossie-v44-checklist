name: Cloud Sync to GitHub DB

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull latest state from Cloud Sync Stream & update progress_db.json
        run: |
          node -e '
          const fs = require("fs");
          async function run() {
            const res = await fetch("https://ntfy.sh/dossie_v45_willy_cloud_stream_7e3b9a/json?poll=1&since=24h");
            if (!res.ok) process.exit(0);
            const text = (await res.text()).trim();
            if (!text) process.exit(0);
            const lines = text.split("\n").filter(Boolean);
            let latestDelta = null;
            for (const line of lines) {
              try {
                const evt = JSON.parse(line);
                if (evt.event === "message" && evt.message) {
                  const parsed = JSON.parse(evt.message);
                  if (parsed && parsed.v === 45) latestDelta = parsed;
                }
              } catch (_) {}
            }
            if (!latestDelta) process.exit(0);

            const dbPath = "data/progress_db.json";
            const db = JSON.parse(fs.readFileSync(dbPath, "utf8"));
            const doneSet = new Set(latestDelta.done || []);
            const scores = latestDelta.scores || {};
            const notes = latestDelta.notes || {};

            for (const col of ["anexoA", "admin", "sprints", "nucleos", "grades"]) {
              for (const item of (db[col] || [])) {
                item.done = doneSet.has(item.id);
                if (scores[item.id] !== undefined) {
                  if (col === "anexoA") item.acertos = scores[item.id];
                  if (col === "sprints") item.qDone = scores[item.id];
                }
                if (notes[item.id] !== undefined) {
                  item.notes = notes[item.id];
                }
              }
            }
            db.lastUpdated = new Date(latestDelta.t || Date.now()).toISOString();
            fs.writeFileSync(dbPath, JSON.stringify(db, null, 2), "utf8");
            console.log("Updated progress_db.json from cloud stream!");
          }
          run();
          '

      - name: Commit & Push updated database if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet data/progress_db.json; then
            git add data/progress_db.json
            git commit -m "chore(cloud-db): auto-sync progress_db.json from GitHub Pages"
            git push
          fi
